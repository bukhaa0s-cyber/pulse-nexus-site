<!DOCTYPE html>
<html lang="en">
<head>
<meta property="og:title" content="Pulse Nexus — can you beat my score?">
<meta property="og:description" content="Guide the light, break the glass. Play this level right here, then get the game.">
<meta property="og:image" content="https://bukhaa0s-cyber.github.io/pulse-nexus-site/icon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-itunes-app" content="app-id=6828459834">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>Pulse Nexus</title>
<style>
:root{--accrgb:34,211,238;--bg1:#0c1424;--bg2:#04060a;--bg:#04060a;--panel:rgba(12,17,28,.94);--line:rgba(255,255,255,.09);--cy:#22d3ee;--am:#fbbf24;--ro:#f43f5e;--em:#34d399;--vi:#c084fc;--tx:#e6edf7;--mut:#8a97ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#020305;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;width:100%;height:100dvh;max-width:460px;max-height:940px;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--bg1) 0%,var(--bg2) 62%);overflow:hidden;transition:background .6s}
@media(min-width:500px){#app{border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.hud{display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 14px 6px}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-weight:800;font-size:13px;transition:transform .12s,background .12s}
.chip:active{transform:scale(.94);background:rgba(255,255,255,.1)}
.chip small{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums}
.chip.lvl b{color:var(--cy);font-size:15px}
.heart{color:var(--ro)}.gem{color:var(--am)}
.chip .t{font-size:10px;color:var(--mut);font-weight:700;min-width:30px}
.tags{display:flex;justify-content:center;gap:6px;min-height:24px;padding:0 14px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(var(--accrgb),.1);border:1px solid rgba(var(--accrgb),.25);color:#7ee7f7}
.tag.boss{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:#fda4af}
.tag.new{background:linear-gradient(90deg,rgba(251,191,36,.25),rgba(249,115,22,.2));border-color:rgba(251,191,36,.6);color:#fde68a;animation:pl 1.6s infinite}
.tag.train{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.45);color:#a7f3d0}
.tag.relief{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#86efac}
.goal{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px 0;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11px;font-weight:800}
.pill span{color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-size:10px}
.pill b{font-size:14px;font-variant-numeric:tabular-nums;display:inline-block}
.pill.moves{background:rgba(244,63,94,.09);border-color:rgba(244,63,94,.28)}
.pill.moves b{color:#fb7185;font-size:17px}
.pill.moves.ok b{color:#67e8f9}
.stars{letter-spacing:2px;color:var(--am);font-size:13px}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#toast{position:absolute;left:50%;bottom:10px;transform:translate(-50%,8px);opacity:0;transition:.25s;pointer-events:none;background:rgba(10,15,26,.95);border:1px solid rgba(var(--accrgb),.35);padding:9px 16px;border-radius:16px;font-size:12px;font-weight:600;text-align:center;max-width:90%;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{display:flex;gap:10px;padding:8px 14px max(18px,env(safe-area-inset-bottom))}
.boost{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;font-size:12px;transition:transform .12s}
.boost:active{transform:scale(.95)}
.boost i{font-style:normal;font-size:18px}
.boost em{font-style:normal;font-size:10px;color:var(--am);display:block;font-weight:800}
#overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,4,8,.9);}
#overlay.show{display:flex}
#overlay.soft{background:rgba(2,4,8,.08);}
.card.soft{background:rgba(10,15,26,.82);border-color:rgba(255,255,255,.14)}
.card{width:100%;max-width:340px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
/* nothing animates where it can't be seen: the home screen keeps 11 looping animations, paused while a level is open */
#title.hide,#title.hide *,#title.hide *::before,#title.hide *::after{animation-play-state:paused!important}
.sp-cell.claimed{animation:spc .45s cubic-bezier(.3,1.7,.5,1)}@keyframes spc{40%{transform:scale(1.12);box-shadow:0 0 18px rgba(251,191,36,.55)}}
.sp-pop{position:absolute;z-index:70;transform:translate(-50%,0);font-weight:900;color:var(--am);text-shadow:0 0 10px rgba(251,191,36,.8);pointer-events:none;animation:spp .9s ease-out forwards}@keyframes spp{to{transform:translate(-50%,-46px);opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:6px 0 2px;font-size:20px;font-weight:900;letter-spacing:.02em}
.card p{margin:4px 0 14px;font-size:12.5px;color:var(--mut);line-height:1.55}
.tipdemo{position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:-4px auto 10px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(var(--accrgb),.12),rgba(2,4,8,.6) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tipdemo canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tipdemo .badge.mini{position:absolute;top:10px;inset-inline-start:10px;width:38px;height:38px;border-radius:12px;font-size:19px;margin:0}
.badge{width:62px;height:62px;border-radius:20px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#22d3ee,#34d399);box-shadow:0 10px 28px rgba(var(--accrgb),.35);color:#04121a}
.badge.bad{background:linear-gradient(135deg,#f43f5e,#dc2626);box-shadow:0 10px 28px rgba(244,63,94,.4);color:#fff}
.badge.gold{background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 10px 28px rgba(251,191,36,.35);color:#1a1000}
.badge.vi{background:linear-gradient(135deg,#c084fc,#6366f1);box-shadow:0 10px 28px rgba(192,132,252,.35);color:#fff}
.bigstars{font-size:34px;letter-spacing:6px;margin:4px 0 8px}
.bigstars .st{position:relative;display:inline-block}
.bigstars .st.burst::after{content:'';position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:2px solid rgba(251,191,36,.85);box-shadow:0 0 14px rgba(251,191,36,.6);animation:ring .6s ease-out forwards;pointer-events:none}
.bigstars .spk{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px #fbbf24;pointer-events:none;animation:spk .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spk{from{transform:rotate(var(--a)) translateX(4px) scale(1)}to{transform:rotate(var(--a)) translateX(var(--r)) scale(.15);opacity:0}}
.stotal{display:inline-flex;align-items:center;gap:6px;margin:-2px auto 6px;padding:5px 12px;border-radius:99px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);font-weight:900;color:#fde68a}
.stotal span{color:var(--am);font-size:16px;text-shadow:0 0 10px rgba(251,191,36,.7)}.stotal em{font-style:normal;font-size:11px;opacity:.75;font-weight:800}
.flystar{font-size:24px}
.bigstars .off{color:rgba(255,255,255,.14)}.bigstars .on{color:var(--am);text-shadow:0 0 14px rgba(251,191,36,.6)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin-top:9px;border-radius:15px;font-weight:900;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.07);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(90deg,#06b6d4,#0ea5e9);color:#fff;box-shadow:0 8px 22px rgba(14,165,233,.35)}
.btn.gold{background:linear-gradient(90deg,#f59e0b,#f97316);color:#1a0d00}
.btn.dis{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}.row .btn{margin-top:9px}
.reward{display:flex;justify-content:center;gap:6px;align-items:center;font-weight:900;color:var(--am);font-size:15px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.lv{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lv small{font-size:8px;color:var(--am);letter-spacing:1px;line-height:1}
.lv.cur{border-color:var(--cy);background:rgba(var(--accrgb),.14);box-shadow:0 0 14px rgba(var(--accrgb),.3)}
.lv.lock{opacity:.3;pointer-events:none}
.pack{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-top:8px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:14px;width:100%}
.pack.pop{border-color:rgba(251,191,36,.7);box-shadow:0 0 16px rgba(251,191,36,.25)}.ptag.bn{background:#34d399;color:#03140f;direction:ltr;unicode-bidi:isolate}.ptag{white-space:nowrap;display:inline-block;margin-top:2px}
.pack span:last-child{white-space:nowrap;flex-shrink:0;background:linear-gradient(90deg,#10b981,#06b6d4);padding:6px 12px;border-radius:10px;font-size:12px;color:#03140f}
.test{font-size:9px;color:var(--ro);font-weight:800;letter-spacing:.1em}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px}.seg button{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800;font-size:12px}.seg button.on{background:var(--cy);color:#02222a}
#adsim{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:22px;background:rgba(0,0,0,.97)}
#adsim.show{display:flex}
.shake{animation:sk .4s}@keyframes sk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.line{font-size:13px;font-weight:800;color:#fcd34d;margin:2px 0 4px}.line b{color:var(--am)}
.line.chest{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:8px}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.skin{padding:9px 2px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px}
.skin i{width:18px;height:18px;border-radius:50%;display:block}
.skin.eq{border-color:var(--cy);box-shadow:0 0 12px rgba(var(--accrgb),.4)}
.sec{font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:900;text-transform:uppercase;margin:14px 0 2px;text-align:start}
.offer{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(249,115,22,.14));border:1px solid rgba(251,191,36,.5);border-radius:18px;padding:12px;margin-top:8px;text-align:start}
.offer.pass{background:linear-gradient(135deg,rgba(192,132,252,.2),rgba(34,211,238,.14));border-color:rgba(192,132,252,.55)}.offer.pass b{color:#e9d5ff}.offer.pass span{color:#d8b4fe}
.offer b{display:block;font-size:14px;color:#fde68a}.offer span{display:block;font-size:11px;color:#fcd34d;opacity:.85;margin:3px 0 8px}
.small{padding:10px;font-size:11px}
.pulse{animation:pl 1.4s infinite}
#wmap{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;background:#04060a}
#wmap.show{display:flex}
.wm-top{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px 10px;background:rgba(4,6,10,.96);border-bottom:1px solid var(--line);position:relative;z-index:5}
.wm-top b{flex:1;font-size:16px;font-weight:900;letter-spacing:.04em}
.wm-far{position:absolute;left:0;right:0;top:0;height:300%;pointer-events:none;z-index:0;will-change:transform;background-image:radial-gradient(1.4px 1.4px at 12% 18%,rgba(255,255,255,.75),transparent 60%),radial-gradient(1px 1px at 66% 32%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.6px 1.6px at 88% 72%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 38% 84%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.2px 1.2px at 52% 56%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1px 1px at 24% 64%,rgba(255,255,255,.4),transparent 60%);background-size:260px 300px}
.wm-fx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.wm-fx i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 8px 2px rgba(var(--wr),.8);animation:wmp var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes wmp{0%{transform:translate(0,30px) scale(.4);opacity:0}15%{opacity:.8}85%{opacity:.5}100%{transform:translate(var(--dx,20px),-140px) scale(1);opacity:0}}
.wm-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative;z-index:1}
#wmInner{position:relative;width:100%}
.wm-band{position:absolute;left:0;right:0;overflow:hidden;content-visibility:auto;contain:layout paint}
#tModes{display:flex;gap:6px;width:100%;margin:2px 0 10px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
#tModes button{flex:1;padding:9px 4px;border-radius:12px;font-weight:900;font-size:13px;color:#cbd5e1;background:transparent;border:1px solid transparent;transition:background .2s,color .2s}
#tModes button.on.m0{background:rgba(34,211,238,.16);color:#fff;border-color:rgba(34,211,238,.5)}
#tModes button.on.m1{background:linear-gradient(160deg,rgba(251,146,60,.3),rgba(239,68,68,.18));color:#fff;border-color:rgba(251,146,60,.65);box-shadow:0 0 16px rgba(251,146,60,.25)}
#tModes button.on.m2{background:linear-gradient(160deg,rgba(225,29,72,.35),rgba(126,34,206,.3));color:#fff;border-color:rgba(244,63,94,.7);box-shadow:0 0 18px rgba(225,29,72,.35)}
#tModes button.lk{opacity:.45}
#title.md1 #btnPlay{background:linear-gradient(170deg,#fdba74,#f97316 45%,#dc2626)}
#title.md2 #btnPlay{background:linear-gradient(170deg,#fb7185,#e11d48 45%,#6d28d9)}
#app.tier1 #hudLevel::before{content:'🔥';margin-inline-end:2px}#app.tier2 #hudLevel::before{content:'☠';margin-inline-end:2px}
#app.tier1 #btnMap{border-color:rgba(251,146,60,.6)}#app.tier2 #btnMap{border-color:rgba(244,63,94,.7);box-shadow:0 0 12px rgba(225,29,72,.35)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--tx)}
#webApp{width:100%}
.wm-seam{position:absolute;left:0;right:0;height:140px;pointer-events:none;background:radial-gradient(65% 42% at 28% 55%,rgba(var(--a),.24),transparent 70%),radial-gradient(65% 42% at 72% 45%,rgba(var(--b),.24),transparent 70%)}
.wm-seam svg{position:absolute;left:0;top:0;overflow:visible}.wm-seam path{fill:none;stroke-linecap:round}
.wm-seam .w1{stroke-width:22;opacity:.16}.wm-seam .w2{stroke-width:2.6;opacity:.9;stroke-dasharray:2 12;animation:sdash 5s linear infinite}.wm-seam .w3{stroke-width:1.2;opacity:.35}
@keyframes sdash{to{stroke-dashoffset:-140}}
.wm-seam i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(var(--mc),.85);animation:smote var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes smote{from{transform:translateY(16px) scale(.6);opacity:.15}to{transform:translateY(-20px) scale(1);opacity:1}}
.wm-band::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 50%,rgba(var(--wr),.12),transparent)}
.wm-scene{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.wm-scene .an{animation:wsway 7s ease-in-out infinite alternate;transform-origin:50% 100%}
.wm-scene .an2{animation:wflo 5s ease-in-out infinite alternate}
.wm-scene .rise{animation:wrise 9s linear infinite}
.wm-scene .spin{animation:wspin 40s linear infinite;transform-box:fill-box;transform-origin:center}
.wm-scene .twk{animation:wtwk 2.6s ease-in-out infinite alternate}
@keyframes wsway{to{transform:skewX(4deg) translateX(10px)}}@keyframes wflo{to{transform:translateY(-14px)}}@keyframes wrise{to{transform:translateY(-120px);opacity:0}}@keyframes wspin{to{transform:rotate(360deg)}}@keyframes wtwk{from{opacity:.25}to{opacity:1}}
.wm-gate{position:absolute;left:50%;transform:translateX(-50%);width:min(86%,330px);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:22px;background:linear-gradient(135deg,rgba(var(--wr),.22),rgba(6,9,16,.9) 55%);border:1.5px solid rgba(var(--wr),.65);box-shadow:0 0 0 4px rgba(var(--wr),.08),0 12px 36px rgba(0,0,0,.55),0 0 30px rgba(var(--wr),.3),inset 0 1px 0 rgba(255,255,255,.18);z-index:4;color:#fff;overflow:hidden}
.wm-gate::before,.wm-gate::after{content:'';position:absolute;top:-30px;bottom:-30px;width:3px;background:linear-gradient(180deg,transparent,rgba(var(--wr),.9),transparent);opacity:.7}
.wm-gate::before{left:6px}.wm-gate::after{right:6px}
.wm-gate .g-ico{width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:27px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(var(--wr),.35) 60%,rgba(var(--wr),.1));box-shadow:0 0 18px rgba(var(--wr),.6),inset 0 0 0 2px rgba(255,255,255,.35);margin-inline-start:4px}
.wm-gate .g-txt{flex:1;min-width:0;text-align:left}.wm-gate .g-txt small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--wc);opacity:.9;text-transform:uppercase}
.wm-gate .g-txt b{display:block;font-size:17px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(var(--wr),.6)}
.wm-gate .g-txt span{display:block;font-size:11px;font-weight:800;color:#fde68a;margin-top:2px}
.wm-gate .g-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden;width:80%}.wm-gate .g-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--am),#fde68a);border-radius:3px}
.wm-gate.lk{border-style:dashed;border-color:rgba(var(--wr),.45);background:linear-gradient(135deg,rgba(var(--wr),.1),rgba(6,9,16,.92) 55%)}
.wm-gate.lk .g-ico{filter:grayscale(.5);opacity:.7}.wm-gate.lk .g-txt b{color:#cbd5e1}
.wm-gate.lk .g-lock{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:300% 100%;animation:gsh 3.6s linear infinite;pointer-events:none}
@keyframes gsh{to{background-position:-300% 0}}

      <button id="adTimer" style="font-size:12px;font-weight:800;color:var(--am);padding:7px 14px;border-radius:99px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.1)">3</button>
    </div>
    <div style="text-align:center"><div class="badge vi pulse" style="width:90px;height:90px;font-size:42px;border-radius:28px">✨</div><h3 style="letter-spacing:.2em;margin:14px 0 4px">YOUR AD HERE</h3><p style="color:var(--mut);font-size:12px;margin:0">Replace Monetization.showRewarded() with your ad SDK</p></div>
    <div></div>
  </div>

<script>
/* =========================================================================
   PULSE NEXUS — LEVEL ENGINE (pure logic, no DOM)
   Design → Verify: every level is generated from a seed, then SOLVED by brute
   force. Move limit = true minimum + slack, so a level can never be unsolvable.
   ========================================================================= */
const K = { EMPTY: 0, WALL: 1, MIRROR: 2, PORTAL: 3, TARGET: 4, CRYSTAL: 5, GLASS: 6, SPLIT: 7, FILTER: 8, GRAV: 9, VOID: 10 };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);

function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const dirIdx = (dx, dy) => (dx + 1) + (dy + 1) * 3;

/* ---------- Ray tracing -------------------------------------------------
   mirror state 0 = "\"  (dx,dy)->(dy,dx)   1 = "/"  (dx,dy)->(-dy,-dx)   2 = OFF (tri-state mirrors only)
   splitter: beam stops, two beams leave perpendicular
   filter  : beam colour &= mask (colour 7 = white, 1 R, 2 G, 4 B)   target lights only on its exact colour
   gravity : fixed 90° turn (cw / ccw) whichever way the beam enters
   dead[i] : a shattered fragile mirror — acts as a wall
   VOID    : outside a shaped (boss) board — acts as a wall
   L.srow  : sliding row — its contents are drawn/traced shifted right by L.soff cells (wrapping)
   L.fixed : extra always-on emitters (twin lasers). A target lights when the OR of every colour that reaches it
             equals its colour (e.g. red beam + blue beam → magenta target)                                    */
function traceOnce(L, rots, em, broken, rec, dead) {
  const cols = L.cols, rows = L.rows, kind = L.kind, ref = L.ref;
  const paths = [], lit = new Set(), crys = new Set(), seen = new Set(), tmask = new Map();
  const srow = L.srow == null ? -1 : L.srow, soff = L.soff || 0;
  const e = L.emitters[em], stack = [];
  for (const s0 of [e].concat(L.fixed || [])) { const c0 = s0.col || 7; stack.push({ x: s0.x, y: s0.y, dx: s0.dx, dy: s0.dy, col: c0, h: rec ? [{ x: s0.x, y: s0.y, col: c0 }] : null }); }

    const b = stack.pop();
    let steps = 0;
    for (;;) {
      if (++steps > 250) break;
      b.x += b.dx; b.y += b.dy;
      if (b.x < 0 || b.y < 0 || b.x >= cols || b.y >= rows) {
        if (rec) { b.h.push({ x: b.x - b.dx * 0.5, y: b.y - b.dy * 0.5, col: b.col }); paths.push(b.h); }
        break;
      }
      const id = b.y * cols + (b.y === srow ? ((b.x - soff) % cols + cols) % cols : b.x);
      const sig = (id * 9 + dirIdx(b.dx, b.dy)) * 8 + b.col;
      if (seen.has(sig)) { if (rec) paths.push(b.h); break; }
      seen.add(sig);
      const k = kind[id];
      if (k === K.WALL || k === K.VOID || (k === K.GLASS && !broken) || (k === K.MIRROR && dead && dead[ref[id]])) {
        if (rec) { b.h.push({ x: b.x - b.dx * 0.5, y: b.y - b.dy * 0.5, col: b.col }); paths.push(b.h); }
        break;
      }
      const pt = { x: b.x, y: b.y, col: b.col };
      if (rec) b.h.push(pt);
      if (k === K.TARGET) { tmask.set(id, (tmask.get(id) || 0) | b.col); if (rec) paths.push(b.h); break; }
      if (k === K.CRYSTAL) { crys.add(id); continue; }
      if (k === K.PORTAL) {
        const link = L.portals[ref[id]].link;
        b.x = link % cols; b.y = (link / cols) | 0;
        if (rec) b.h.push({ x: b.x, y: b.y, col: b.col, jump: true });
        continue;
      }
      if (k === K.MIRROR) {
        const mi = ref[id], st = rots[mi];
        mhit |= (1 << mi);
        if (st === 2) continue;
        if (st === 0) { const t = b.dx; b.dx = b.dy; b.dy = t; }
        else { const t = b.dx; b.dx = -b.dy; b.dy = -t; }
        continue;
      }
      if (k === K.FILTER) {
        b.col &= L.fcol[id]; pt.col = b.col;
        if (!b.col) { if (rec) paths.push(b.h); break; }
        continue;
      }
      if (k === K.GRAV) {
        if (L.gdir[id] > 0) { const t = b.dx; b.dx = -b.dy; b.dy = t; }
        else { const t = b.dx; b.dx = b.dy; b.dy = -t; }
        continue;
      }
      if (k === K.SPLIT) {
        stack.push({ x: b.x, y: b.y, dx: -b.dy, dy: b.dx, col: b.col, h: rec ? b.h.slice() : null });
        stack.push({ x: b.x, y: b.y, dx: b.dy, dy: -b.dx, col: b.col, h: rec ? b.h.slice() : null });
        break;

    }
  }
  tmask.forEach((m, id) => { if (m === (L.tcol ? L.tcol[id] : 7)) lit.add(id); });
  return { paths, lit, crys, mhit };
}

/* Crystals gate the glass: when ALL crystals are lit the glass shatters. */
function evaluate(L, rots, em, rec, dead) {
  let r = traceOnce(L, rots, em, false, rec, dead), mhit = r.mhit;
  let broken = false;
  if (L.glass.length && L.crystals.length && r.crys.size === L.crystals.length) {
    broken = true; r = traceOnce(L, rots, em, true, rec, dead); mhit |= r.mhit;
  }

/* ---------- Solver ------------------------------------------------------
   Beam-driven branch-and-bound: only branches on unlocked mirrors currently
   touched by the laser beam, pruning any branch that cannot beat `best`.
   Cost = taps: 1 per binary flip, 0..2 forward taps for tri-state, 1 to pick another emitter slot. */
function solveFrom(L, rots0, em0, dead, off0, frozen, maxCost) {
  // frozen[i]: a mirror the player can no longer rotate (a fragile mirror whose next tap would shatter it) — it still reflects
  const hasS = L.srow != null && L.srow >= 0, C = L.cols, savedOff = L.soff || 0;
  if (off0 == null) off0 = savedOff;
  const free = [], radix = [], mBit = new Int32Array(L.mirrors.length);
  for (let i = 0; i < L.mirrors.length; i++) {
    const m = L.mirrors[i]; if (m.locked || (dead && dead[i]) || (frozen && frozen[i])) continue;
    if (m.link >= 0 && m.link < i) continue;          // a linked pair is ONE unit: a tap flips both

    const ev = evaluate(L, rots, curEm, false, dead);

      return;

      } else {
        for (let d = 1; d <= 2; d++) {
          if (baseC + c + d >= best) break;
          rots[i] = (r0 + d) % 3;
          search(c + d, fMask);
        }
        rots[i] = r0;
      }
      if (baseC + c + 1 >= best) return;
    }
  }
  for (let oc = 0; oc < (hasS ? C : 1) && oc < best; oc++) {
    if (hasS) L.soff = (off0 + oc) % C;
    for (let ei = 0; ei < E; ei++) {
      curEm = ei === 0 ? em0 : (ei <= em0 ? ei - 1 : ei);
      baseC = oc + (curEm !== em0 ? 1 : 0);
      if (baseC >= best) continue;
      search(0, 0);
    }
  }
  L.soff = savedOff;
  return best === limit ? null : { min: best, rots: bestRots, em: bestEm, off: bestOff };
}

/* ---------- Difficulty curve --------------------------------------------
   Rhythm: every 5th level = breather, every 10th = boss, the rest normal.
   New mechanics are introduced one at a time on fixed levels (INTRO).
   Each WORLD (50 levels, cycling every 5 worlds) has a signature mechanic.   */
const INTRO = { 1: 'basic', 6: 'lock', 16: 'portal', 26: 'glass', 36: 'mover', 51: 'split', 61: 'tri', 71: 'link', 81: 'fragile', 91: 'color', 106: 'grav', 116: 'fog', 126: 'slider', 136: 'twin' };
const WORLDS_N = 9;   // Nexus, Aurora, Ember, Nebula, Abyss, Mirage, Glacier, Eclipse, Oasis
const SIG_WORLD = { tri: 1, fragile: 2, color: 3, grav: 4, fog: 5, slider: 6, twin: 7, link: 8 };      // world index (0-based, mod WORLDS_N)
const SIG_FROM = { tri: 63, link: 73, fragile: 83, color: 93, grav: 108, fog: 118, slider: 128, twin: 138 }; // first level index (0-based) where it may mix with others (after its 3 training levels)
/* Candy-Crush style onboarding: every new mechanic gets
   step 0 = introduction (tiny, only that mechanic) · step 1-2 = practice (only that mechanic, a bit bigger)
   step 3 = first combination with ONE mechanic the player already knows. Only after that it joins the random mix. */
const TRAIN = {};
for (const lv in INTRO) if (INTRO[lv] !== 'basic') for (let k = 0; k < 4; k++) TRAIN[+lv + k] = { f: INTRO[lv], step: k };

const INTRO_AT = {}; for (const lv in INTRO) INTRO_AT[INTRO[lv]] = +lv;
const worldOf = n => Math.floor((n - 1) / 50);
function voidAt(sh, x, y, C, R) {          // silhouettes for boss boards
  const mx = (C - 1) / 2, my = (R - 1) / 2;
  if (sh === 'hex') return x + y < 2 || (C - 1 - x) + y < 2 || x + (R - 1 - y) < 2 || (C - 1 - x) + (R - 1 - y) < 2;
  if (sh === 'cross') return (x < 2 || x > C - 3) && (y < 2 || y > R - 3);
  if (sh === 'ring') return Math.abs(x - mx) < 1 && Math.abs(y - my) <= 1;
  if (sh === 'notch') return Math.abs(x - mx) < 1 && (y < 2 || y > R - 3);
  return false;
}

const RAMP = 95;
function paramsFor(n) {
  // v1.1: the climb is steeper — boards reach full size/turns by level ~95 (was 170), so levels get properly hard from
  // around level 50 instead of 100. The spare moves still follow the old, slower scale, so mid levels are tighter too.
  const i = n - 1, grow = Math.min(1, i / RAMP), pr = mulberry32((n * 2654435761) >>> 0);
  const late = Math.max(0, Math.min(1, (i - RAMP) / 390));   // a second, slower climb after level 95 (full at 485): longer solutions, more mirrors, a 4th mechanic
  const tr = TRAIN[n] || null, drill = tr && tr.step < 3;
  const rhythm = drill ? 'train' : (n % 10 === 0 ? 'boss' : (n % 5 === 0 ? 'relief' : 'normal'));
  const intro = INTRO[n] || null;
  let cols = 4; if (i >= 2) cols = 5; if (i >= 14) cols = 6; if (i >= 40) cols = 7; if (i >= 400) cols = 8;
  const rows = Math.min(11, cols + 1 + (i >= 70 ? 1 : 0) + (i >= 300 ? 1 : 0));

  let turns;
  if (i < 3) turns = [1, 1, 2][i];
  else {
    let tt = 1.5 + grow * 8.5;
    if (rhythm === 'boss') tt += 1.5; if (rhythm === 'relief') tt -= 1.5;
    turns = Math.max(1, Math.min(11 + Math.round(late * 5), Math.round(tt + late * 5 + (pr() - 0.5) * 1.4)));
  }

  const feats = new Set();
  const pool = [];
  if (i >= 18) pool.push(['portal', 0.30 + 0.25 * grow]);
  if (i >= 28) pool.push(['glass', 0.28 + 0.20 * grow]);
  if (i >= 38) pool.push(['mover', 0.28 + 0.20 * grow]);
  if (i >= 53) pool.push(['split', 0.28 + 0.20 * grow]);
  const wi = worldOf(n) % WORLDS_N;
  const sig = [];
  for (const f in SIG_FROM) if (i >= SIG_FROM[f]) { if (SIG_WORLD[f] === wi) sig.push([f, 0.9]); else pool.push([f, 0.22 + 0.12 * grow]); }
  const maxF = grow < 0.35 ? 1 : (grow < 0.7 ? 2 : (late < 0.5 ? 3 : 4));
  shuffle(pool, pr);
  const relief = rhythm === 'relief' ? 0.5 : 1;
  for (const [f, p] of sig.concat(pool)) if (feats.size < Math.max(maxF, sig.length ? 2 : 1) && pr() < p * relief) feats.add(f);
  if (rhythm === 'boss' && !feats.size && (sig.length || pool.length)) feats.add((sig[0] || pool[0])[0]);
  if (tr) {
    feats.clear(); if (tr.f !== 'lock') feats.add(tr.f);
    if (tr.step === 3) {      // combine with exactly one mechanic the player already trained on
      const known = MECH_ORDER.filter(f => f !== tr.f && INTRO_AT[f] + 3 <= n);
      if (known.length) feats.add(known[Math.floor(pr() * known.length)]);
    }
  }
  if (feats.has('twin')) feats.delete('color');   // twin lasers already use colour; allow twin+mover and twin+split synergies
  const shape = rhythm === 'boss' && i >= 44 ? ['hex', 'cross', 'ring', 'notch'][Math.floor(pr() * 4)] : null;   // boss boards get a silhouette

  let decoys = Math.floor(grow * 8 + late * 3 + (rhythm === 'boss' ? 2 : 0) - (rhythm === 'relief' ? 1 : 0) + pr() * 1.5);
  if (i < 5) decoys = i >= 3 ? 1 : 0;
  decoys = Math.max(0, decoys);
  let walls = i >= 6 ? Math.floor(grow * 4 + pr() * 2) : 0;
  let lockRatio = i >= 8 ? Math.min(0.3, 0.12 + 0.25 * grow) : 0;
  const forceLock = !!(drill && tr.f === 'lock');
  if (forceLock) decoys = Math.max(decoys, 1);
  if (drill) {
    const st = tr.step, sp = tr.f === 'split' ? 1 : 0;
    turns = Math.min(turns, 3 + st + sp); decoys = Math.min(decoys, 1 + st); walls = st < 2 ? 0 : Math.min(walls, 1);
    if (tr.f !== 'lock') lockRatio = st < 2 ? 0 : Math.min(lockRatio, 0.2);
  } else if (tr && tr.step === 3) turns = Math.min(turns, 7);

  let lo = rhythm === 'relief' ? 1 + Math.floor(grow * 2) : 1 + Math.floor(grow * 5);
  if (rhythm === 'boss') lo += 1;
  lo += Math.min(5, Math.floor(Math.max(0, i - RAMP) / 60));
  if (i < 5) lo = 1;
  if (drill) lo = 1 + Math.min(1, tr.step);
  if (!drill && !intro && i >= 12) {      // no more one-tap levels once the basics are learnt: a floor on the minimum solution
    const floor = rhythm === 'relief' ? (i >= 25 ? 2 : 1) : (i >= 40 ? 3 : 2);
    lo = Math.max(lo, floor); turns = Math.max(turns, lo + 1);
  }

  const hi = drill ? lo + (tr.step === 0 ? 2 : 3) : lo + 3 + Math.floor(grow * 3) + feats.size;

  /* Room to experiment: the move limit sits well above the true minimum, so a wrong tap costs a move, not the
     level (as in match-3 games). Stars still reward the minimum, so the level stays hard to perfect. The room grows
     with the level: +3 at the start, about +10 late on; bosses give a little less, breathers a little more. */
  let slack;
  if (drill) slack = tr.step === 0 ? 4 : 3;
  else {
    slack = 3 + Math.round(Math.min(1, i / 170) * 4 + late * 3);   // 3 → 7 by level 170 → 10 by level 500
    if (rhythm === 'boss') slack = Math.max(2, slack - 2);
    if (rhythm === 'relief') slack += 1;
  }
  if (feats.has('fog')) slack += 1;      // exploring hidden tiles costs a move or two

  return {
    n, i, grow, rhythm, intro, train: tr ? tr.step : null, trainF: tr ? tr.f : null, cols, rows, turns, features: feats, lockRatio, forceLock, decoys, walls,
    emitters: feats.has('mover') ? Math.min(4, 2 + (grow > 0.5 ? 1 : 0) + (pr() < 0.3 ? 1 : 0)) : 1,
    crystals: 2 + (grow > 0.5 ? 1 : 0), side: (i >= 4 && pr() < 0.4) ? 1 : 0,
    maxRun: grow < 0.3 ? 3 : 4, scramble: i >= RAMP ? 0.85 + 0.1 * late : 0.7, minWrong: Math.max(1, Math.floor(turns * (i >= RAMP ? 0.65 + 0.15 * late : 0.5) * (1 - lockRatio))),
    gravCount: drill && tr.f === 'grav' ? 1 + (tr.step > 1 ? 1 : 0) : 1 + (pr() < 0.5 ? 1 : 0) + (grow > 0.6 ? 1 : 0),
    triFrac: drill && tr.f === 'tri' ? 0.9 : 0.5, fragLife: (drill || grow < 0.5 || pr() < 0.6) ? 2 : 1,
    shape, twinTurns: drill ? 1 : 1 + Math.floor(pr() * 3), fogPatches: drill ? 1 : 1 + (grow > 0.6 ? 1 : 0),
    lo, hi, slack, maxProd: feats.has('slider') ? 8192 : Math.round(65536 * (1 + 2 * late))
  };
}

/* ---------- Candidate builder (constructive path with crossings & shared mirrors) -------- */
function buildCandidate(P, rng) {
  const cols = P.cols, rows = P.rows, N = cols * rows;
  const used = new Uint8Array(N), pass = new Uint8Array(N), reserved = new Uint8Array(N), typ = new Uint8Array(N);
  const inB = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
  const isFree = (x, y) => inB(x, y) && !used[y * cols + x];
  const allowCross = P.i >= 18 && !P.train;
  const canPass = (x, y, db) => {
    if (!inB(x, y)) return false;
    const id = y * cols + x;
    return !used[id] || (allowCross && !typ[id] && pass[id] !== 0 && !(pass[id] & db));
  };
  const validRuns = (x, y, dx, dy, maxR) => {
    const db = dx !== 0 ? 1 : 2, runs = [];
    for (let s = 1; s <= maxR; s++) {
      const nx = x + dx * s, ny = y + dy * s;
      if (isFree(nx, ny)) runs.push(s);
      if (!canPass(nx, ny, db)) break;
    }
    return runs;
  };
  const stepRun = (x, y, dx, dy, L, branch) => {
    const db = dx !== 0 ? 1 : 2;
    for (let s = 1; s <= L; s++) {
      x += dx; y += dy; const id = y * cols + x; used[id] = 1;
      if (s < L) {

        if (!crossed) { straight.push(id); if (branch >= 0) straightB[branch].push(id); }
      }
    }
    return { x, y, id: y * cols + x };
  };
  const trySharedMirror = (x, y, dx, dy, branch) => {
    if (P.i < 42 || P.train != null) return null;
    const db = dx !== 0 ? 1 : 2;
    for (let s = 1; s <= P.maxRun; s++) {
      const mx = x + dx * s, my = y + dy * s;
      if (!inB(mx, my)) break;
      const mid = my * cols + mx;
      if (typ[mid] === K.MIRROR) {
        const pm = pathMirrors.find(m => m.id === mid);
        if (pm && !pm.shared && (dx !== pm.inDx || dy !== pm.inDy) && (dx !== -pm.outDx || dy !== -pm.outDy)) {
          const nx = pm.rot === 0 ? dy : -dy, ny = pm.rot === 0 ? dx : -dx;
          if (validRuns(mx, my, nx, ny, P.maxRun).length && rng() < 0.75) {

            pm.shared = true;
            return { x: mx, y: my, dx: nx, dy: ny };

      }

  };
  const pathMirrors = [], targets = [], portals = [], straight = [], straightB = [[], [], []], splits = [], gravCells = [];
  let curB = 0;
  const vd = new Uint8Array(N);
  if (P.shape) for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (voidAt(P.shape, x, y, cols, rows)) { vd[y * cols + x] = 1; used[y * cols + x] = 1; }
  let ex, ey, edx, edy;
  if (P.side === 0) { const c = []; for (let y = 1; y < rows - 1; y++) if (!vd[y * cols]) c.push(y); if (!c.length) return null; ex = 0; ey = c[Math.floor(rng() * c.length)]; edx = 1; edy = 0; }
  else { const c = []; for (let x = 1; x < cols - 1; x++) if (!vd[x]) c.push(x); if (!c.length) return null; ey = 0; ex = c[Math.floor(rng() * c.length)]; edx = 0; edy = 1; }
  used[ey * cols + ex] = 1;
  const st = { portal: false, split: false };
  const F = P.features, wantPortal = F.has('portal'), wantSplit = F.has('split'), wantGrav = F.has('grav'), wantColor = F.has('color'), wantTri = F.has('tri'), wantFrag = F.has('fragile'), wantLink = F.has('link'), wantTwin = F.has('twin'), wantFog = F.has('fog'), wantSlider = F.has('slider');

  function walk(x, y, dx, dy, turns, allowSplit) {
    for (let t = 0; t <= turns; t++) {
      if (t < turns && curB === 2) {
        const sh = trySharedMirror(x, y, dx, dy, curB);
        if (sh) { x = sh.x; y = sh.y; dx = sh.dx; dy = sh.dy; continue; }
      }

    catch (e) { const m = String((e && (e.code || e.message)) || ''); if (!/cancel|1001|12501/i.test(m)) err(t('signInFail')); }
    finally { this.busy = false; btns.forEach(b => { b.disabled = false; }); }
  },
  async enter(u) {
    this.user = u;
    const guest = !S.owner;      // progress made as a guest on this phone is kept and merged into the account
    if (S.owner && S.owner !== u.uid) S = Object.assign(defSave(), this.keepPrefs(S));   // another account was used on this phone: start clean, then load this account
    S.owner = u.uid; if (!S.name && u.name) S.name = String(u.name).split(' ')[0].slice(0, 16);
    persist(); await Cloud.pull(guest); LANG = S.lang; Cloud.push();
    renderTitle(); if (game.L) UI.hud(); this.hide(); Analytics.track('login', { p: u.provider, guest });
  },
  toTitle(msg) {      // back to the title with a clean local save (the account's copy stays in the cloud); play continues as a guest
    S = Object.assign(defSave(), this.keepPrefs(S)); persist(); LANG = S.lang;
    UI.closeModal(); $('#wmap').classList.remove('show'); $('#title').classList.remove('hide'); $('#app').classList.add('ontitle');
    game.startDemo(); renderTitle();
    if (this.required()) this.show(msg); else if (msg) toast(msg, 3000);
  },
  async signOut() { Cloud.push(); try { await window.PNBridge.authSignOut(); } catch (e) {} this.user = null; this.toTitle(); },
  async del() {      // Apple guideline 5.1.1(v): accounts must be deletable inside the app
    try { await window.PNBridge.authDelete(); } catch (e) { toast(t('signInFail'), 3000); return; }
    Analytics.track('account_deleted'); this.user = null; this.toTitle(t('delDone'));
  }
};
$('#lgApple').addEventListener('click', () => Account.signIn('apple'));
$('#lgGoogle').addEventListener('click', () => Account.signIn('google'));

$('#lgLangs').addEventListener('click', e => { const b = e.target.closest('[data-ll]'); if (!b) return; S.lang = LANG = b.dataset.ll; persist(); Account.render(); renderTitle(); });

/* ---------- wire up ---------- */
$('#overlay').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) { sound.click(); UI.act(b); } });
document.querySelectorAll('.hud .chip, .boost, #btnPlay, #btnDaily').forEach(b => b.addEventListener('pointerdown', () => sound.click()));
$('#btnMap').addEventListener('click', () => UI.openMap());
$('#wmap').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) { sound.click(); UI.act(b); } });
$('#btnShop').addEventListener('click', () => UI.shop());
$('#btnHearts').addEventListener('click', () => { tickHearts(); if (S.hearts < CFG.MAX_HEARTS) { UI.noHearts(game.n); } else toast('♥ ' + S.hearts + '/' + CFG.MAX_HEARTS); });
$('#btnSettings').addEventListener('click', () => UI.settings());
$('#btnReset').addEventListener('click', () => game.resetBoard());
$('#btnUndo').addEventListener('click', () => game.doUndo());
$('#btnHint').addEventListener('click', () => game.doHint());
document.body.addEventListener('touchmove', e => { if (!e.target.closest('.card, .wm-scroll, .tcontent')) e.preventDefault(); }, { passive: false });   // block page rubber-banding, but let cards and the world map scroll with a finger
setInterval(() => { if (game && game.L) UI.hud(); }, 1000);

const game = new Game();

/* ---------- live demo in the "new mechanic" card ----------
   Instead of an icon, the card plays the mechanic: a tiny board built with the SAME generator and the SAME renderer
   as the game, solved move by move by the solver, then replayed on a loop. It is a different board from the level the
   player is about to solve (same mechanic, other seed), so it teaches without spoiling. Silent and vibration-free. */
const TipDemo = {
  g: null,
  quiet(fn) {            // run one step of the demo with every sound, music duck and vibration switched off
    const saved = {}, ready = sound.ready, duck = Music.duck;
    for (const k in sound) if (typeof sound[k] === 'function') { saved[k] = sound[k]; sound[k] = () => {}; }
    sound.ready = false; Music.duck = () => {};
    try { return fn(); } finally { for (const k in saved) sound[k] = saved[k]; sound.ready = ready; Music.duck = duck; }
  },
  start(cv, f) {
    this.stop();
    const at = f === 'basic' ? 1 : INTRO_AT[f]; if (!at) return;
    let L; try { L = makeLevel(at, 7300000 + at); } catch (e) { return; }
    const key = 9000000 + at; _lvlCache.set(key, L);
    const g = Object.create(Game.prototype), self = this, ghost = { classList: { contains: x => x === 'hide' } }, none = { classList: { contains: () => false } };
    Object.assign(g, { cv, ctx: cv.getContext('2d'), title: ghost, wm: none, th: game.th, particles: [], shake: 0, state: 'idle', pending: null, hintCell: -1, hintUntil: 0,
      beamLen: 0, beamTotal: 0, beamSpeed: 14, res: null, L: null, last: performance.now(), demoKey: key, alive: true });
    g.applyTheme = function () { this.th = game.th; };
    g.drawBg = () => {}; g.perfCheck = () => {}; g.say = () => {};
    g.resize = function () {
      const r = this.cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      this.W = Math.max(50, r.width); this.H = Math.max(50, r.height); this.cv.width = this.W * dpr; this.cv.height = this.H * dpr;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); this.calcGrid();
    };
    g.calcGrid = function () {          // a small board: no room reserved for the HUD
      if (!this.L) return; const pad = 16, L = this.L;
      this.cs = Math.min((this.W - pad * 2) / L.cols, (this.H - pad * 2) / L.rows, 64);
      this.ox = (this.W - this.cs * L.cols) / 2; this.oy = (this.H - this.cs * L.rows) / 2;
    };
    g.startDemo = function () { if (!this.alive) return; _lvlCache.set(this.demoKey, L); self.quiet(() => this.start(this.demoKey, { mode: 'demo' })); this.demoNext = this.beamHold + 1500; };   // let the blocked beam be seen first
    g.loop = function (now) { if (!this.alive) return; self.quiet(() => Game.prototype.loop.call(this, now)); };
    g.demoStep = function () {         // a calmer pace than the home-screen demo, and a finger on every tap
      const u = this.used; Game.prototype.demoStep.call(this); this.demoNext = performance.now() + 1300;
      const lt = this.lastTap; if (this.used > u && lt) (this.floats || (this.floats = [])).push({ x: lt.x + this.cs * .22, y: lt.y + this.cs * .42, text: '👆', col: '#ffffff', t0: performance.now() });
    };
    this.g = g; g.resize(); g.startDemo(); g.resize();
    requestAnimationFrame(tm => g.loop(tm));
  },
  stop() { if (this.g) { this.g.alive = false; this.g = null; } }
};
document.documentElement.lang = LANG;
if (CFG.DEV) game.start(Math.max(1, S.highest)); else game.startDemo();
function onTitle() { return $('#app').classList.contains('ontitle'); }
function exitTitle() { if (!onTitle()) return; sound.init(); Music.start(); $('#title').classList.add('hide'); $('#app').classList.remove('ontitle'); }
function worldStars(w) { let s = 0; for (let n = w * 50 + 1; n <= w * 50 + 50; n++) s += S.stars[n] || 0; return s; }
function renderTitle() {
  const n = Math.max(1, S.highest), w = worldOf(n), th = THEMES[w % THEMES.length], tt = $('#title'), ws = worldStars(w), wn = LANG === 'ar' ? th.ar : th.en;
  tt.style.setProperty('--cy', th.c); tt.style.setProperty('--accrgb', th.rgb); tt.style.setProperty('--tr2', th.rgb2 || th.rgb);
  $('#tTag').textContent = t('tagline'); $('#tGems').textContent = S.gems - (UI.holdGems || 0);
  const md = modeOpen(S.mode) ? S.mode : 0; if (md !== S.mode) S.mode = md;
  $('#tModes').innerHTML = [0, 1, 2].map(m => '<button data-m="' + m + '" class="' + (m === md ? 'on ' : '') + (modeOpen(m) ? '' : 'lk ') + 'm' + m + '">' + (modeOpen(m) ? '' : ic('lock', 'sm')) + esc(t(['mdClassic', 'mdHard', 'mdExtreme'][m])) + '</button>').join('');
  $('#tModes').style.display = modeOpen(1) ? '' : 'none';      // nothing to choose until Hard opens
  $('#tWorld').style.display = md ? 'none' : '';      // the world card is about the Classic road
  $('#title').classList.toggle('md1', md === 1); $('#title').classList.toggle('md2', md === 2);
  $('#btnPlay').innerHTML = '<span class="pm">' + ic('play') + esc(t('play')) + '</span><span class="ps">' + (md ? esc(t(md === 2 ? 'mdExtreme' : 'mdHard')) + ' · ' + esc(t('mdStage')) + ' ' + S.tr[md].k : esc(t('level')) + ' ' + n) + '</span>';
  $('#tWorld').innerHTML = '<div class="wi-ico">' + WICON[w % WICON.length] + '</div><div class="wi-txt"><b>' + esc(t('world')) + ' ' + (w + 1) + ' · ' + esc(wn) + '</b><div class="wi-bar"><i style="width:' + Math.round(ws / 150 * 100) + '%"></i></div></div><div class="wi-st">★ ' + ws + '/150</div>';
  $('#btnEndless').innerHTML = (S.highest < CFG.ENDLESS_FROM ? ic('lock') : ic('inf')) + esc(noEmo(t('endBtn'))) + (S.endBest ? '<em>' + S.endBest + '</em>' : '');
  $('#btnWeekly').innerHTML = ic('cal') + esc(noEmo(t('wkBtn'))); $('#btnRecords').querySelector('span').textContent = t('recT'); $('#tMap').querySelector('span').textContent = t('navMap'); $('#tShop').querySelector('span').textContent = t('shop');
  const xo = extrasOn(); ['#btnEndless', '#btnWeekly', '#btnRecords'].forEach(q => { $(q).style.display = xo ? '' : 'none'; }); $('#btnEvent').style.display = 'none'; $('.tgrid').style.display = xo ? '' : 'none';
  document.querySelectorAll('.xtra').forEach(b => { b.style.display = xo ? '' : 'none'; });
  if (EVENT && xo) { const e = ensureEvent(); $('#btnEvent').style.display = ''; $('#btnEvent').textContent = EVENT.icon + ' ' + t('ev_' + EVENT.id) + ' · ' + e.tok + '/' + CFG.EVENT_GOALS[CFG.EVENT_GOALS.length - 1]; }
  if (CHALLENGE || WK_LINK) { $('#btnChallenge').style.display = ''; $('#btnChallenge').innerHTML = ic(CHALLENGE ? 'target' : 'cal') + '<span>' + esc(noEmo(CHALLENGE ? t('chBanner', { name: CHALLENGE.from || t('friend'), n: CHALLENGE.n + (CHALLENGE.t ? ' · ' + t(CHALLENGE.t === 2 ? 'mdExtreme' : 'mdHard') : ''), m: CHALLENGE.m }) : t('wkBanner', { m: WK_LINK }))) + '</span>'; }
  if (WEBPLAY && !$('#webApp')) { const d = document.createElement('div'); d.id = 'webApp'; d.innerHTML = UI.getAppBtns(); $('#btnDaily').after(d); }
  const dd = S.dc.day === dayNum(); $('#btnDaily').innerHTML = ic('sun') + esc(noEmo(t('dcBtn'))) + (dd ? ic('check', 'done') : '<i class="dot"></i>'); $('#btnDaily').classList.remove('pulse');
  document.documentElement.lang = LANG;
  tt.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
}
function modeOpen(m) { return !m || (m === 1 ? S.highest > CFG.HARD_FROM : S.tr[1].k > CFG.EXTREME_AFTER); }
$('#tModes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const m = +b.dataset.m; sound.click();
  if (!modeOpen(m)) { toast('🔒 ' + (m === 1 ? t('mdLock1', { n: CFG.HARD_FROM }) : t('mdLock2', { n: CFG.EXTREME_AFTER })), 2800); return; }
  if (m !== S.mode) { S.mode = m; persist(); renderTitle(); if (m) toast((m === 2 ? '☠ ' : '🔥 ') + t(m === 2 ? 'mdExtremeSub' : 'mdHardSub'), 3000); }
});
function leaveTitle() { if (S.mode && modeOpen(S.mode)) { exitTitle(); game.start(S.tr[S.mode].k, { mode: S.mode === 2 ? 'extreme' : 'hard' }); return; } exitTitle(); game.start(Math.max(1, S.highest)); if (PREV_SEEN && Date.now() - PREV_SEEN > 3 * 86400000 && S.wins > 0) UI.comeback(); else if (S.wins > 0 || S.highest > 1) UI.daily(); }
$('#btnPlay').addEventListener('click', leaveTitle);
$('#btnDaily').addEventListener('click', () => UI.startDaily());
$('#btnWeekly').addEventListener('click', () => UI.startWeekly());
$('#btnRecords').addEventListener('click', () => UI.records());
$('#btnEvent').addEventListener('click', () => UI.eventInfo());
$('#tGemsBtn').addEventListener('click', () => UI.shop());
$('#tShop').addEventListener('click', () => UI.shop());
$('#tSettings').addEventListener('click', () => UI.settings());
$('#tMap').addEventListener('click', () => UI.openMap());
document.querySelectorAll('.t-top .chip, .t-nav button').forEach(b => b.addEventListener('pointerdown', () => sound.click()));
const CHALLENGE = (() => { const q = new URLSearchParams(location.search), n = +q.get('ch'), m = +q.get('m'); return n > 0 && m > 0 ? { n: Math.min(Math.floor(n), 5000), m: Math.min(Math.floor(m), 99), from: (q.get('from') || '').replace(/[<>&"'`]/g, '').slice(0, 16), t: [1, 2].includes(+q.get('t')) ? +q.get('t') : 0 } : null; })();   // name from the URL is untrusted: strip HTML characters
const WK_LINK = (() => { const q = new URLSearchParams(location.search); return +q.get('wk') === weekNum() ? +q.get('m') || 0 : 0; })();
$('#btnChallenge').addEventListener('click', () => { if (CHALLENGE) game.playChallenge(CHALLENGE); else UI.startWeekly(); });
$('#btnEndless').addEventListener('click', () => UI.startEndless());
renderTitle();
setTimeout(() => { try { getLevel(Math.max(1, S.highest)); } catch (e) {} }, 1200);   // warm up the level the Play button opens
Cloud.pull().then(ok => { if (ok) { renderTitle(); if (game.L) UI.hud(); } });
Account.boot();
window.addEventListener('pagehide', () => Cloud.push());
document.addEventListener('pointerdown', () => { sound.ready = true; sound.ensure(); Music.start(); }, { once: true, capture: true });
if (CFG.DEV) { window.game = game; $('#title').classList.add('hide'); $('#app').classList.remove('ontitle'); }
</script>
